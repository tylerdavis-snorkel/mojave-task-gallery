      async function submitNewTask() {
        clearMessage();
        clearError();

        if (!isAdmin()) {
          showError("You do not have permission to add tasks.");
          return;
        }

        const displayId = String(document.getElementById("newTaskDisplayId")?.value || "").trim();
        const priority = String(document.getElementById("newTaskPriority")?.value || "").trim();
        const computeType = String(document.getElementById("newTaskComputeType")?.value || "").trim();
        const domain = String(document.getElementById("newTaskDomain")?.value || "").trim();
        const subdomain = String(document.getElementById("newTaskSubdomain")?.value || "").trim();
        const paperTitle = String(document.getElementById("newTaskPaperTitle")?.value || "").trim();
        const venueYear = String(document.getElementById("newTaskVenueYear")?.value || "").trim();
        const sourcesText = String(document.getElementById("newTaskSources")?.value || "").trim();
        const taskConcept = String(document.getElementById("newTaskConcept")?.value || "").trim();
        const suggestedSteps = String(document.getElementById("newTaskSteps")?.value || "").trim();
        const verifierIdeas = String(document.getElementById("newTaskVerifierIdeas")?.value || "").trim();

        if (!displayId) {
          showError("Idea ID is required.");
          return;
        }

        if (!paperTitle) {
          showError("Paper title is required.");
          return;
        }

        if (!isValidDomainPair(domain, subdomain)) {
          showError("That subtopic does not belong to the selected topic. Pick one from the list.");
          return;
        }

        const existingTask = TASKS.find(task => String(task.task_id) === String(displayId));

        if (existingTask) {
          const ok = window.confirm("An idea with this ID already exists. Continue to update it?");
          if (!ok) return;
        }

        const sources = sourcesText
          ? sourcesText
              .split(/\n|,/)
              .map(source => source.trim())
              .filter(Boolean)
          : [];

        const { error } = await supabaseClient
          .from("harbor_tasks")
          .upsert({
            created_at: existingTask ? existingTask.created_at : new Date().toISOString(),
            display_id: displayId,
            priority,
            compute_type: computeType,
            domain,
            subdomain,
            paper_title: paperTitle,
            venue_year: venueYear,
            sources,
            task_concept: taskConcept,
            suggested_harbor_steps: suggestedSteps,
            verifier_ideas: verifierIdeas
          }, {
            onConflict: "display_id"
          });

        if (error) {
          console.error(error);
          showError("Could not add this task.");
          return;
        }

        const modal = document.querySelector(".modal-backdrop");
        if (modal) modal.remove();

        showMessage(existingTask ? "Task updated." : "Task added.");
        await loadTasks();
      }

      // Remember where the last click landed so a toast can appear next to it
      // instead of interrupting in the middle of the screen.
      let lastPointer = null;

      document.addEventListener("click", function (event) {
        if (event.clientX || event.clientY) {
          lastPointer = { x: event.clientX, y: event.clientY };
        }
      }, true);

      let toastEl = null;
      let toastTimer = null;

      function showToast(message, isError) {
        if (!message) return;

        if (!toastEl) {
          toastEl = document.createElement("div");
          toastEl.className = "toast";
          document.body.appendChild(toastEl);
        }

        toastEl.textContent = message;
        toastEl.classList.toggle("is-error", Boolean(isError));
        toastEl.classList.remove("show");

        // Measure, then place near the click, clamped inside the viewport.
        toastEl.style.left = "0px";
        toastEl.style.top = "0px";

        const rect = toastEl.getBoundingClientRect();
        const margin = 12;
        const anchor = lastPointer || {
          x: window.innerWidth - rect.width - margin,
          y: window.innerHeight - rect.height - margin * 2
        };

        let left = anchor.x + 14;
        let top = anchor.y + 16;

        if (left + rect.width + margin > window.innerWidth) {
          left = Math.max(margin, anchor.x - rect.width - 14);
        }

        if (top + rect.height + margin > window.innerHeight) {
          top = Math.max(margin, anchor.y - rect.height - 16);
        }

        toastEl.style.left = Math.max(margin, left) + "px";
        toastEl.style.top = Math.max(margin, top) + "px";

        requestAnimationFrame(() => toastEl.classList.add("show"));

        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          if (toastEl) toastEl.classList.remove("show");
        }, isError ? 5200 : 2600);
      }

      function showMessage(message) {
        const el = document.getElementById("message");
        el.textContent = "";
        el.style.display = "none";
        showToast(message, false);
      }

      function showError(message) {
        const el = document.getElementById("error");
        el.textContent = "";
        el.style.display = "none";
        showToast(message, true);
      }

      function clearMessage() {
        const el = document.getElementById("message");
        el.textContent = "";
        el.style.display = "none";
      }

      function clearError() {
        const el = document.getElementById("error");
        el.textContent = "";
        el.style.display = "none";
      }

      function shorten(value, maxLength) {
        const text = String(value || "");
        if (text.length <= maxLength) return text;
        return text.slice(0, maxLength).trim() + "...";
      }

      function formatDate(value) {
        if (!value) return "";

        const date = new Date(value);

        if (isNaN(date.getTime())) return "";

        return date.toLocaleString();
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#096;");
      }

      function renderFloatingNotice() {
        const el = document.getElementById("floatingNotice");
        if (!el) return;

        if (!WORKFLOW_A_CLOSED) {
          el.innerHTML = "";
          return;
        }

        el.innerHTML = `
          <div class="floating-notice" role="status">
            <button class="floating-notice-close" title="Dismiss" onclick="this.closest('.floating-notice').remove()">×</button>
            <strong>Workflow A update</strong>
            ${escapeHtml(WORKFLOW_A_CLOSED_MESSAGE)}
          </div>
        `;
      }

      function applyTheme(theme) {
        document.body.dataset.theme = theme;
        const btn = document.getElementById("themeToggle");
        if (btn) btn.textContent = theme === "dark" ? "Light mode" : "Dark mode";
      }

      function toggleTheme() {
        applyTheme(document.body.dataset.theme === "dark" ? "light" : "dark");
      }

      function initTheme() {
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        applyTheme(prefersDark ? "dark" : "light");
      }

      async function init() {
        initTheme();
        await loadSession();
        await loadTasks();
        renderFloatingNotice();
      }

      init();
    </script>
