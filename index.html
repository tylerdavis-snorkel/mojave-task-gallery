<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mojave Task Idea Gallery</title>

    <style>
      :root {
        color-scheme: light;
        --bg: #f5f3ef;
        --card: #ffffff;
        --text: #111c2d;
        --muted: rgba(14, 23, 37, 0.698);
        --muted-strong: rgba(14, 23, 37, 0.78);
        --border: rgba(14, 23, 37, 0.118);
        --soft: #efede9;
        --blue: #1c398e;
        --blue-dark: #16306f;
        --on-blue: #ffffff;
        --blue-shadow: rgba(28, 57, 142, 0.22);
        --green-soft: #e3f7ed;
        --green-ink: #16855d;
        --yellow-soft: #fff0c7;
        --amber-ink: #9a6800;
        --purple-soft: rgba(28, 57, 142, 0.12);
        --violet-ink: #1c398e;
        --red-soft: #ffe4e7;
        --red-ink: #b3313c;
        --orange-soft: #fff0c7;
        --pill-ink: rgba(14, 23, 37, 0.78);
        --line-soft: rgba(14, 23, 37, 0.08);
        --hover-border: rgba(14, 23, 37, 0.2);
        --btn-hover: #e6e2db;
        --placeholder: rgba(14, 23, 37, 0.45);
        --empty-bg: rgba(255, 255, 255, 0.7);
        --pre-bg: #f1efeb;
        --overlay: rgba(17, 28, 45, 0.78);
        --notice-bg: #111c2d;
        --notice-ink: #ffffff;
        --notice-muted: rgba(255, 255, 255, 0.6);
        --notice-accent: #ffd6a0;
        --shadow-sm: 0 18px 45px rgba(14, 23, 37, 0.06);
        --shadow: 0 18px 45px rgba(14, 23, 37, 0.08);
        --shadow-md: 0 18px 45px rgba(14, 23, 37, 0.12);
        --shadow-lg: 0 18px 50px rgba(14, 23, 37, 0.35);
        --shadow-xl: 0 30px 90px rgba(14, 23, 37, 0.35);
      }

      body[data-theme="dark"] {
        color-scheme: dark;
        --bg: #07111f;
        --card: rgba(15, 27, 45, 0.88);
        --text: #f4f7ff;
        --muted: #a9b4ca;
        --muted-strong: #c3ccdd;
        --border: rgba(132, 153, 190, 0.18);
        --soft: rgba(28, 42, 68, 0.72);
        --blue: #2f6fed;
        --blue-dark: #6fa1ff;
        --on-blue: #07111f;
        --blue-shadow: rgba(45, 108, 223, 0.28);
        --green-soft: rgba(20, 137, 87, 0.24);
        --green-ink: #4ad48b;
        --yellow-soft: rgba(247, 183, 51, 0.18);
        --amber-ink: #f7b733;
        --purple-soft: rgba(111, 161, 255, 0.18);
        --violet-ink: #6fa1ff;
        --red-soft: rgba(243, 107, 114, 0.18);
        --red-ink: #f36b72;
        --orange-soft: rgba(247, 183, 51, 0.18);
        --pill-ink: #d4dcec;
        --line-soft: rgba(132, 153, 190, 0.16);
        --hover-border: rgba(161, 177, 209, 0.28);
        --btn-hover: rgba(40, 58, 90, 0.85);
        --placeholder: rgba(169, 180, 202, 0.7);
        --empty-bg: rgba(15, 27, 45, 0.6);
        --pre-bg: rgba(28, 42, 68, 0.72);
        --overlay: rgba(3, 8, 16, 0.82);
        --notice-bg: rgba(21, 34, 56, 0.96);
        --notice-ink: #f4f7ff;
        --notice-muted: rgba(244, 247, 255, 0.6);
        --notice-accent: #f7b733;
        --shadow-sm: 0 26px 70px rgba(0, 0, 0, 0.28);
        --shadow: 0 26px 70px rgba(0, 0, 0, 0.35);
        --shadow-md: 0 26px 70px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 26px 70px rgba(0, 0, 0, 0.5);
        --shadow-xl: 0 30px 90px rgba(0, 0, 0, 0.6);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }

      header {
        max-width: 1180px;
        margin: 0 auto;
        padding: 42px 28px 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 4vw, 48px);
        line-height: 1.08;
        letter-spacing: -0.035em;
        font-weight: 700;
      }

      .subtitle {
        margin-top: 14px;
        max-width: 720px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.45;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 16px 28px 64px;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }

      .identity {
        color: var(--muted);
        font-size: 14px;
      }

      .panel-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        margin: 22px 0 28px;
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px;
        box-shadow: var(--shadow-sm);
      }

      .panel h2 {
        margin: 0 0 10px;
        font-size: 20px;
        letter-spacing: -0.025em;
      }

      .panel p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.45;
      }

      .panel-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .message {
        display: none;
        margin: 16px 0;
        border-radius: 14px;
        padding: 14px 16px;
        background: var(--green-soft);
        color: var(--green-ink);
        font-weight: 700;
      }

      .error {
        display: none;
        margin: 16px 0;
        border-radius: 14px;
        padding: 14px 16px;
        background: var(--red-soft);
        color: var(--red-ink);
        font-weight: 700;
        white-space: pre-wrap;
      }

      .search-shell {
        margin: 24px auto 40px;
        max-width: 860px;
        display: grid;
        grid-template-columns: 1fr 190px 190px;
        gap: 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        box-shadow: var(--shadow);
        position: relative;
        overflow: visible;
      }

      .search-part,
      .filter-part {
        padding: 16px 22px;
      }

      .filter-part {
        position: relative;
      }

      .filter-part + .filter-part {
        border-left: 1px solid var(--border);
      }

      .filter-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        padding: 0;
        border: 0;
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 18px;
        line-height: 1.4;
        cursor: pointer;
        text-align: left;
      }

      .filter-trigger:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 4px;
        border-radius: 6px;
      }

      .filter-trigger .value {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .filter-trigger .chev {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 11px;
        transition: transform 140ms ease;
      }

      .filter-part.is-open .filter-trigger .chev {
        transform: rotate(180deg);
      }

      .filter-menu {
        position: absolute;
        z-index: 200;
        top: calc(100% + 10px);
        left: 0;
        width: max(100%, 280px);
        padding: 6px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow-xl);
      }

      .filter-part:last-child .filter-menu {
        left: auto;
        right: 0;
      }

      .filter-menu[hidden] {
        display: none;
      }

      .filter-menu-list {
        max-height: 296px;
        overflow-y: auto;
        padding: 2px;
      }

      .filter-option {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }

      .filter-option:hover {
        background: var(--soft);
      }

      .filter-option .box {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border: 1.5px solid var(--line-strong, var(--border));
        border-radius: 6px;
        color: transparent;
        font-size: 12px;
        font-weight: 800;
      }

      .filter-option.is-on .box {
        background: var(--blue);
        border-color: var(--blue);
        color: var(--on-blue);
      }

      .filter-option .text {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .filter-menu-footer {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 4px;
        padding: 8px 8px 4px;
        border-top: 1px solid var(--line-soft);
      }

      .filter-menu-footer button {
        padding: 6px 8px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .filter-menu-footer button:hover {
        color: var(--text);
        background: var(--soft);
      }

      .active-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: -18px 0 22px;
      }

      .filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 6px 10px;
        background: var(--soft);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .filter-chip:hover {
        background: var(--btn-hover);
      }

      .filter-chip .x {
        color: var(--muted);
      }

      .search-part {
        border-right: 1px solid var(--border);
      }

      .label {
        display: block;
        margin-bottom: 6px;
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      input,
      select {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 18px;
      }

      .panel input,
      .panel select,
      .modal input,
      .modal select,
      .modal textarea {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        background: var(--card);
      }

      .modal textarea {
        width: 100%;
        min-height: 110px;
        resize: vertical;
        font: inherit;
      }

      input::placeholder {
        color: var(--placeholder);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 26px;
      }

      .stat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px;
      }

      .stat strong {
        display: block;
        font-size: 24px;
      }

      .stat span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .section-heading {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 18px;
      }

      .section-heading h2 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.03em;
      }

      .count-bubble {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 30px;
        height: 24px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--muted);
        font-weight: 700;
        font-size: 13px;
      }

      .task-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .task {
        display: flex;
        flex-direction: column;
        min-height: 212px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px 18px;
        transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      }

      .task:hover {
        transform: translateY(-2px);
        border-color: var(--hover-border);
        box-shadow: var(--shadow-md);
      }

      .task-historical {
        opacity: 0.62;
        filter: grayscale(0.5);
      }

      .task.task-historical:hover,
      .task.task-locked:hover {
        transform: none;
        border-color: var(--border);
        box-shadow: none;
      }

      /* Claimed by someone else: the substance of the tile is unreadable. */
      .task-locked .task-title,
      .task-locked .task-id,
      .task-locked .preview {
        filter: blur(6px);
        user-select: none;
        pointer-events: none;
      }

      .lock-note {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .toast {
        position: fixed;
        z-index: 1200;
        max-width: 320px;
        padding: 11px 14px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: var(--notice-bg);
        color: var(--notice-ink);
        font-size: 14px;
        font-weight: 700;
        line-height: 1.4;
        box-shadow: var(--shadow-lg);
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 140ms ease, transform 140ms ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: none;
      }

      .toast.is-error {
        background: var(--red-soft);
        border-color: var(--red-ink);
        color: var(--red-ink);
      }

      .eyebrow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 5px 10px;
        color: var(--pill-ink);
        background: var(--soft);
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
      }

      .Available {
        background: var(--green-soft);
        color: var(--green-ink);
      }

      .Claimed {
        background: var(--yellow-soft);
        color: var(--amber-ink);
      }

      .Submitted {
        background: var(--purple-soft);
        color: var(--violet-ink);
      }

      .Approved {
        background: var(--green-soft);
        color: var(--green-ink);
      }

      .Blocked {
        background: var(--red-soft);
        color: var(--red-ink);
      }

      .Expired,
      .Abandoned,
      .Reopened {
        background: var(--soft);
        color: var(--muted);
      }

      .task-title {
        margin: 0 0 8px;
        font-size: 17px;
        line-height: 1.25;
        letter-spacing: -0.025em;
        font-weight: 800;
      }

      .task-id {
        margin: 0 0 10px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
      }

      .idea-id {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: inherit;
      }

      .idea-id-label {
        font-family: var(--font, inherit);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .idea-id code {
        font-family: inherit;
        letter-spacing: 0.01em;
      }

      .idea-id-trailing {
        color: var(--muted);
      }

      .id-copy {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .id-copy:hover {
        background: var(--soft);
        color: var(--text);
      }

      .id-copy svg {
        width: 13px;
        height: 13px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .task-locked .id-copy {
        display: none;
      }

      .preview {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .task-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: auto;
        padding-top: 14px;
        border-top: 1px solid var(--line-soft);
      }

      .link-button,
      .primary-button,
      .danger-button,
      .success-button,
      .warning-button,
      .copy-button,
      .neutral-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 12px;
        padding: 11px 14px;
        font-weight: 800;
        font-size: 15px;
        text-decoration: none;
        cursor: pointer;
      }

      .link-button {
        color: var(--text);
        background: transparent;
      }

      .primary-button {
        color: var(--on-blue);
        background: var(--blue);
        box-shadow: 0 10px 24px var(--blue-shadow);
      }

      .primary-button:hover {
        background: var(--blue-dark);
      }

      .danger-button {
        color: var(--red-ink);
        background: var(--red-soft);
      }

      .success-button {
        color: var(--green-ink);
        background: var(--green-soft);
      }

      .warning-button {
        color: var(--amber-ink);
        background: var(--orange-soft);
      }

      .copy-button {
        color: var(--text);
        background: var(--soft);
        border: 1px solid var(--border);
      }

      .copy-button:hover {
        background: var(--btn-hover);
      }

      .neutral-button {
        color: var(--pill-ink);
        background: var(--soft);
        border: 1px solid var(--border);
      }

      .neutral-button:hover {
        background: var(--btn-hover);
      }

      button:disabled,
      a.disabled,
      .disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .empty {
        padding: 36px;
        border: 1px dashed var(--border);
        border-radius: 18px;
        color: var(--muted);
        background: var(--empty-bg);
      }

      .list-item {
        border-top: 1px solid var(--line-soft);
        padding: 12px 0;
      }

      .list-item:first-of-type {
        border-top: 0;
      }

      .list-title {
        font-weight: 800;
      }

      .muted {
        color: var(--muted);
        font-size: 14px;
      }

      .field-hint {
        display: none;
        margin-top: 6px;
        font-size: 13px;
        line-height: 1.4;
        color: var(--red-ink);
      }

      .field-hint a {
        color: var(--red-ink);
        font-weight: 700;
      }

      .floating-notice {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 1100;
        max-width: 340px;
        background: var(--notice-bg);
        color: var(--notice-ink);
        border-radius: 18px 18px 4px 18px;
        padding: 18px 20px;
        box-shadow: var(--shadow-lg);
        font-size: 15px;
        line-height: 1.5;
        animation: floatingNoticeIn 260ms ease-out;
      }

      .floating-notice strong {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--notice-accent);
      }

      .floating-notice .floating-notice-close {
        position: absolute;
        top: 10px;
        right: 12px;
        border: 0;
        background: transparent;
        color: var(--notice-muted);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      .floating-notice .floating-notice-close:hover {
        color: var(--notice-ink);
      }

      @keyframes floatingNoticeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .metrics-table {
        width: 100%;
        margin-top: 16px;
        border-collapse: collapse;
        font-size: 15px;
      }

      .metrics-table th,
      .metrics-table td {
        padding: 12px 14px;
        text-align: left;
        border-bottom: 1px solid var(--line-soft);
      }

      .metrics-table th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .metrics-table td.num,
      .metrics-table th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .metrics-table tbody tr:hover {
        background: var(--soft);
      }

      .metrics-table .domain-cell {
        font-weight: 800;
      }

      .metrics-table tr.is-low td.num.available {
        color: var(--amber-ink);
        font-weight: 800;
      }

      .metrics-table tr.is-empty td.num.available {
        color: var(--red-ink);
        font-weight: 800;
      }

      .brand-logo {
        display: block;
        width: 156px;
        max-width: 60vw;
        margin: 0 0 18px;
        opacity: 0.92;
      }

      .brand-logo img {
        display: block;
        width: 100%;
        max-height: 30px;
        object-fit: contain;
      }

      body[data-theme="dark"] .brand-logo img {
        filter: brightness(0) invert(1);
      }

      @media (max-width: 900px) {
        .floating-notice {
          right: 12px;
          left: 12px;
          bottom: 12px;
          max-width: none;
        }
      }

      .queue-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
        margin-top: 22px;
      }

      @media (max-width: 900px) {
        .queue-columns {
          grid-template-columns: 1fr;
        }
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: var(--overlay);
      }

      .modal {
        position: relative;
        width: min(1080px, 100%);
        max-height: 88vh;
        overflow: auto;
        background: var(--card);
        border-radius: 28px;
        padding: 46px 54px 36px;
        box-shadow: var(--shadow-xl);
      }

      .modal-close {
        position: absolute;
        top: 22px;
        right: 22px;
        border: 0;
        width: 38px;
        height: 38px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--text);
        cursor: pointer;
        font-size: 22px;
        line-height: 1;
      }

      .modal h2 {
        margin: 20px 0 8px;
        max-width: 850px;
        font-size: clamp(28px, 4vw, 44px);
        line-height: 1.05;
        letter-spacing: -0.045em;
      }

      .modal .task-id {
        margin-bottom: 22px;
        font-size: 15px;
      }

      .modal-section {
        margin-top: 24px;
      }

      .modal-section h3 {
        margin: 0 0 10px;
        font-size: 15px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .modal-section p,
      .modal-section pre {
        margin: 0;
        color: var(--muted-strong);
        font-size: 18px;
        line-height: 1.55;
      }

      .modal-section pre {
        white-space: pre-wrap;
        font-family: inherit;
        background: var(--pre-bg);
        border-radius: 14px;
        padding: 18px;
      }

      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 14px;
        margin-top: 34px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }

      .tab-bar {
        display: flex;
        gap: 4px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border);
      }

      .tab-button {
        border: 0;
        background: transparent;
        padding: 12px 18px;
        font-weight: 800;
        font-size: 15px;
        color: var(--muted);
        cursor: pointer;
        border-bottom: 3px solid transparent;
        margin-bottom: -1px;
      }

      .tab-button:hover {
        color: var(--text);
      }

      .tab-button.active {
        color: var(--text);
        border-bottom-color: var(--blue);
      }

      @media (max-width: 900px) {
        .panel-grid,
        .task-grid,
        .stats {
          grid-template-columns: 1fr;
        }

        .search-shell {
          grid-template-columns: 1fr;
          border-radius: 24px;
        }

        .search-part {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }

        .top-bar {
          align-items: flex-start;
          flex-direction: column;
        }

        .modal {
          padding: 34px 26px 28px;
          border-radius: 22px;
        }
      }
    </style>

  </head>

  <body>
    <header>
      <div class="brand-logo" aria-label="Snorkel">
        <img src="https://s46486.pcdn.co/wp-content/uploads/2023/05/snorkel_logo_header-1.svg" alt="Snorkel">
      </div>
      <h1>Mojave Task Idea Gallery</h1>
      <div class="subtitle">Browse task ideas for Project Mojave, claim one idea at a time, then submit your Snorkel Submission ID.</div>
    </header>

    <main>
      <div class="top-bar">
        <div class="identity" id="identity">Loading session...</div>
        <div class="panel-actions" style="margin-top: 0;">
          <button class="link-button" id="themeToggle" onclick="toggleTheme()">Dark mode</button>
          <button class="link-button" onclick="openContributorGuideModal()">How to claim tasks</button>
          <button class="primary-button" id="signInButton" onclick="signInWithGitHub()">Sign in with GitHub</button>
          <button class="link-button" id="signOutButton" onclick="signOut()" style="display: none;">Sign out</button>
        </div>
      </div>

      <div id="message" class="message"></div>
      <div id="error" class="error"></div>

      <div id="accessGate" style="display: none;"></div>

      <div id="appContent">
        <div class="stats" id="stats"></div>

        <div class="panel-grid">
          <div class="panel" id="myClaimPanel"></div>
          <div class="panel" id="submittedPanel"></div>
        </div>

        <div class="tab-bar">
          <button class="tab-button active" id="tabButtonBrowse" onclick="switchTab('browse')">Browse Tasks</button>
          <button class="tab-button" id="tabButtonMetrics" onclick="switchTab('metrics')" style="display: none;">Domain Metrics</button>
          <button class="tab-button" id="tabButtonAdmin" onclick="switchTab('admin')" style="display: none;">Admin Tools</button>
        </div>

        <div id="browseTab">
          <div class="search-shell">
            <div class="search-part">
              <span class="label">Where</span>
              <input id="search" placeholder="Search ideas... e.g. by topic" oninput="renderTaskList()">
            </div>

            <div class="filter-part">
              <span class="label">Status</span>
              <button class="filter-trigger" id="statusTrigger" onclick="toggleFilterMenu('status', event)">
                <span class="value" id="statusTriggerLabel">All</span>
                <span class="chev">&#9660;</span>
              </button>
              <div class="filter-menu" id="statusMenu" hidden></div>
            </div>

            <div class="filter-part">
              <span class="label">Domain</span>
              <button class="filter-trigger" id="domainTrigger" onclick="toggleFilterMenu('domain', event)">
                <span class="value" id="domainTriggerLabel">All</span>
                <span class="chev">&#9660;</span>
              </button>
              <div class="filter-menu" id="domainMenu" hidden></div>
            </div>
          </div>

          <div class="active-filters" id="activeFilters"></div>

          <div class="section-heading">
            <h2 id="sectionTitle">All Mojave Task Ideas</h2>
            <span class="count-bubble" id="visibleCount">0</span>
          </div>

          <div id="taskList">Loading tasks...</div>
        </div>

        <div id="metricsTab" style="display: none;"></div>

        <div class="panel" id="adminTab" style="display: none;"></div>
      </div>
    </main>

    <div id="floatingNotice"></div>

      const DEMO_USER = { id: "local-demo-user", email: "tyler.davis@snorkel.ai" };

      function localMatches(row, filters) {
        return filters.every(f => {
          if (f.op === "eq") return row[f.col] === f.val;
          if (f.op === "in") return f.val.includes(row[f.col]);
          return true;
        });
      }

      function localExpireClaims() {
        const now = Date.now();
        let count = 0;

        LOCAL_DB.harbor_selected_tasks.forEach(claim => {
          if (claim.status === "claimed" && claim.expires_at && new Date(claim.expires_at).getTime() < now) {
            claim.status = "expired";
            claim.expires_at = null;
            count += 1;
          }
        });

        return count;
      }

      class LocalQuery {
        constructor(table) {
          this.table = table;
          this.op = "select";
          this.payload = null;
          this.filters = [];
          this.orderBy = null;
        }

        select(_cols) { this.op = "select"; return this; }
        insert(payload) { this.op = "insert"; this.payload = payload; return this; }
        update(payload) { this.op = "update"; this.payload = payload; return this; }
        upsert(payload, opts) { this.op = "upsert"; this.payload = payload; this.onConflict = opts?.onConflict; return this; }
        order(col, opts) { this.orderBy = { col, ascending: opts?.ascending !== false }; return this; }
        eq(col, val) { this.filters.push({ op: "eq", col, val }); return this; }
        in(col, val) { this.filters.push({ op: "in", col, val }); return this; }

        run() {
          const rows = LOCAL_DB[this.table];

          if (!rows) return { data: null, error: { message: "Unknown table " + this.table } };

          if (this.op === "select") {
            let out = rows.filter(r => localMatches(r, this.filters)).map(r => ({ ...r }));

            if (this.orderBy) {
              const { col, ascending } = this.orderBy;
              out.sort((a, b) => {
                const av = a[col], bv = b[col];
                const an = parseInt(av, 10), bn = parseInt(bv, 10);
                let cmp;
                if (Number.isFinite(an) && Number.isFinite(bn)) cmp = an - bn;
                else cmp = String(av || "").localeCompare(String(bv || ""));
                return ascending ? cmp : -cmp;
              });
            }

            return { data: out, error: null };
          }

          if (this.op === "insert") {
            const row = { id: "claim-" + (localClaimSeq++), ...this.payload };
            rows.push(row);
            return { data: [row], error: null };
          }

          if (this.op === "update") {
            const hit = rows.filter(r => localMatches(r, this.filters));
            hit.forEach(r => Object.assign(r, this.payload));
            return { data: hit, error: null };
          }

          if (this.op === "upsert") {
            const key = this.onConflict || "id";
            const existing = rows.find(r => r[key] === this.payload[key]);
            if (existing) Object.assign(existing, this.payload);
            else rows.push({ id: "task-" + (rows.length + 1), ...this.payload });
            return { data: [this.payload], error: null };
          }

          return { data: null, error: { message: "Unsupported op" } };
        }

        then(resolve, reject) {
          try { return Promise.resolve(this.run()).then(resolve, reject); }
          catch (err) { return Promise.reject(err).catch(reject); }
        }
      }

      // Stands in for the Supabase client: same call shapes, but all state lives

      // ---- Idea IDs -------------------------------------------------------
      // Format: mjv-xxxx-xxxx using Crockford base32 (no i, l, o or u, so an
      // ID can be read aloud or retyped without ambiguity). 8 random chars is
      // 32^8 ~= 1.1 trillion possibilities, so collisions are vanishingly rare
      // even before the uniqueness check below. Generation never encodes domain,
      // author or order — those live in their own columns and are free to change.
      const IDEA_KEY_PREFIX = "mjv";
      const IDEA_KEY_ALPHABET = "0123456789abcdefghjkmnpqrstvwxyz";
      const IDEA_KEY_LENGTH = 8;

      function randomIdeaKey() {
        const bytes = new Uint8Array(IDEA_KEY_LENGTH);
        (window.crypto || window.msCrypto).getRandomValues(bytes);

        const chars = [...bytes].map(byte => IDEA_KEY_ALPHABET[byte % IDEA_KEY_ALPHABET.length]).join("");
        return `${IDEA_KEY_PREFIX}-${chars.slice(0, 4)}-${chars.slice(4)}`;
      }

      // Generate, then check against what is already loaded. The database's
      // unique constraint is the real guarantee — this just avoids the round trip.
      function newIdeaKey() {
        const taken = new Set(TASKS.map(task => String(task.task_id)));

        for (let attempt = 0; attempt < 12; attempt += 1) {
          const key = randomIdeaKey();
          if (!taken.has(key)) return key;

      // A domain is flagged once this many or fewer of its ideas are still

      const LOW_DOMAIN_THRESHOLD = 2;

      function getDomainCoverage() {
        const rows = new Map();

        TASKS.forEach(task => {
          const domain = String(task.domain || "").trim() || "Unassigned";

          if (!rows.has(domain)) {
            rows.set(domain, {
              domain, total: 0, available: 0, claimed: 0,
              submitted: 0, approved: 0, other: 0, used: 0
            });
          }

          const row = rows.get(domain);
          const status = effectiveStatus(task);

          row.total += 1;

          if (status === "Available") row.available += 1;
          else if (status === "Claimed") row.claimed += 1;
          else if (status === "Submitted") row.submitted += 1;
          else if (status === "Approved") row.approved += 1;
          else row.other += 1;

          // "Used" is anything that has left the available pool.
          if (status !== "Available") row.used += 1;
        });

        // Thinnest domains first so the gaps are the first thing you see.
        return [...rows.values()].sort((a, b) =>
          a.available - b.available || a.domain.localeCompare(b.domain)
        );

          panel.innerHTML = `
            <h2>Your active claim</h2>
            <p>You do not currently have an active claim.</p>
          `;
          return;
        }

        panel.innerHTML = `
          <h2>Your active claim</h2>
          <div class="list-title">${escapeHtml(claim.paper_title)}</div>
          <div class="task-id">${ideaIdChip(claim.task_id)}</div>
          <div class="muted">Claimed ${formatDate(claim.active_claim_selected_at)}</div>
          <div class="muted">Expires ${formatDate(claim.active_claim_expires_at)}</div>

          <div style="margin-top: 14px;">
            <input id="snorkelSubmissionId" placeholder="Snorkel Submission ID" oninput="onSubmissionIdInput()">
            <p class="muted" style="margin-top: 6px;">Please ensure this is the proper UID from the upper left hand side of the task UI</p>
            <p class="field-hint" id="submissionIdHint">
              Uh oh! That doesn't look like the submission ID.
              <a href="#" onclick="openWhereIsIdModal(); return false;">Where's my submission ID?</a>
            </p>
          </div>

          <div class="panel-actions">
            <button class="success-button" id="submitClaimBtn" onclick="submitMyClaim()" disabled>Submit</button>
            <button class="danger-button" onclick="releaseMyClaim()">Release</button>
          </div>
        `;

        // Set the initial disabled state (empty field is invalid).
        onSubmissionIdInput();
      }

      function onSubmissionIdInput() {
        const input = document.getElementById("snorkelSubmissionId");
        const hint = document.getElementById("submissionIdHint");
        const btn = document.getElementById("submitClaimBtn");
        if (!input) return;

        const val = input.value.trim();
        const valid = isValidSubmissionId(val);

        // Show the "uh oh" hint once they've typed something that isn't valid.
        if (hint) hint.style.display = (val && !valid) ? "block" : "none";

        // Button is only clickable when the ID is a valid UID.
        if (btn) btn.disabled = !valid;
      }

      function openWhereIsIdModal() {
        const modal = document.createElement("div");
        modal.className = "modal-backdrop";
        modal.onclick = function(event) {
          if (event.target === modal) modal.remove();
        };
        modal.innerHTML = `
          <div class="modal">
            <button class="modal-close" onclick="this.closest('.modal-backdrop').remove()">×</button>
            <h2>Where's my submission ID?</h2>
            <div class="modal-section">
              <p>The submission ID is at the <strong>top left of the task UI</strong> — it will say <strong>UID</strong>. Please use this ID.</p>
            </div>
            <div class="modal-section">
              <img src="${SUBMISSION_ID_HELP_IMG}" alt="Screenshot showing the UID at the top left of the task submission UI" style="width: 100%; border: 1px solid var(--border); border-radius: 12px;">
            </div>
            <div class="modal-section">
              <p>Need help finding it? <a href="${escapeAttr(SLACK_HELP_URL)}" target="_blank" rel="noopener noreferrer">Message us in Slack</a>.</p>
            </div>
            <div class="modal-footer">
              <a class="primary-button" href="#" onclick="this.closest('.modal-backdrop').remove(); return false;">Got it</a>
            </div>
          </div>
        `;
        document.body.appendChild(modal);
      }

      function renderSubmittedPanel() {
        const panel = document.getElementById("submittedPanel");

        if (!currentUser) {
          panel.innerHTML = `
            <h2>Your submitted tasks</h2>
            <p>Sign in to see your submitted tasks.</p>
          `;
          return;
        }

        const submitted = getMySubmittedTasks();

        if (!submitted.length) {
          panel.innerHTML = `
            <h2>Your submitted tasks</h2>
            <p>No submitted tasks yet.</p>
          `;
          return;
        }

        panel.innerHTML = `
          <h2>Your submitted tasks</h2>
          ${submitted.slice(0, 10).map(task => `
            <div class="list-item">
              <div class="list-title">${escapeHtml(task.paper_title)}</div>
              <div class="task-id">${ideaIdChip(task.task_id)}</div>
              <div class="muted">Status: ${escapeHtml(task.status)}</div>
              <div class="muted">Submitted: ${formatDate(task.active_claim_submitted_at)}</div>
              <div class="muted">Snorkel Submission ID: ${escapeHtml(task.active_claim_submission_id || "")}</div>
            </div>
          `).join("")}
        `;
      }

      let currentTab = "browse";

      function switchTab(tab) {
        currentTab = tab;
        document.getElementById("browseTab").style.display = tab === "browse" ? "" : "none";
        document.getElementById("metricsTab").style.display = tab === "metrics" ? "block" : "none";
        document.getElementById("adminTab").style.display = tab === "admin" ? "block" : "none";
        document.getElementById("tabButtonBrowse").classList.toggle("active", tab === "browse");
        document.getElementById("tabButtonMetrics").classList.toggle("active", tab === "metrics");
        document.getElementById("tabButtonAdmin").classList.toggle("active", tab === "admin");

        if (tab === "metrics") renderMetricsPanel();
      }

      let adminEditMode = false;
      const adminSelected = new Set();

      function toggleAdminEditMode() {
        adminEditMode = !adminEditMode;
        if (!adminEditMode) adminSelected.clear();
        renderAdminPanel();
      }

      function toggleAdminSelected(claimId, checked) {
        if (checked) {
          adminSelected.add(claimId);
        } else {
          adminSelected.delete(claimId);
        }
        // Update just the count label without a full re-render (keeps checkboxes responsive).
        const countEl = document.getElementById("bulkSelectedCount");
        if (countEl) countEl.textContent = String(adminSelected.size);
      }

      // Every claim currently shown in the two admin queues.
      function adminSelectableIds() {
        return [...getAdminReviewQueue(), ...getAdminUngradeableQueue()]
          .map(task => task.active_claim_id)
          .filter(Boolean);
      }

      function allAdminSelected() {
        const ids = adminSelectableIds();
        return ids.length > 0 && ids.every(id => adminSelected.has(id));
      }

      function toggleSelectAllAdmin() {
        if (allAdminSelected()) adminSelected.clear();
        else adminSelectableIds().forEach(id => adminSelected.add(id));

        renderAdminPanel();
      }

      function renderQueueItem(task, opts) {
        const showGradeLater = opts && opts.showGradeLater;
        const checkbox = adminEditMode
          ? `<label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:700;cursor:pointer;">
               <input type="checkbox" style="width:auto;" ${adminSelected.has(task.active_claim_id) ? "checked" : ""}
                 onchange="toggleAdminSelected('${escapeAttr(String(task.active_claim_id))}', this.checked)">
               Select
             </label>`
          : "";

        const perItemActions = adminEditMode
          ? ""
          : `<div class="panel-actions">
               <button class="copy-button" onclick="copyIdeaToClipboard('${escapeAttr(String(task.task_id))}')">Copy idea</button>
               <button class="success-button" onclick="approveTask('${escapeAttr(String(task.task_id))}')">Accept</button>
               ${showGradeLater ? `<button class="neutral-button" onclick="markUngradeable('${escapeAttr(String(task.task_id))}')">Grade later</button>` : ""}
               <button class="warning-button" onclick="undoSubmittedOrApprovedTask('${escapeAttr(String(task.task_id))}')">Undo submission</button>
             </div>`;

        return `
          <div class="list-item">
            ${checkbox}
            <div class="list-title">${escapeHtml(task.paper_title)}</div>
              <div class="task-id">${ideaIdChip(task.task_id)}</div>
            <div class="muted">Submitted by: ${escapeHtml(task.active_claim_email || "")}</div>
            <div class="muted">Submitted at: ${formatDate(task.active_claim_submitted_at)}</div>
            <div class="muted">Snorkel Submission ID: ${escapeHtml(task.active_claim_submission_id || "")}</div>
            ${perItemActions}
          </div>
        `;
      }

      function renderAdminPanel() {
        const tabButton = document.getElementById("tabButtonAdmin");
        const panel = document.getElementById("adminTab");

        const metricsButton = document.getElementById("tabButtonMetrics");

        if (!isAdmin()) {
          tabButton.style.display = "none";
          metricsButton.style.display = "none";
          panel.innerHTML = "";
          document.getElementById("metricsTab").innerHTML = "";
          adminEditMode = false;
          adminSelected.clear();
          if (currentTab === "admin" || currentTab === "metrics") {
            switchTab("browse");
          }
          return;
        }

        tabButton.style.display = "inline-block";
        metricsButton.style.display = "inline-block";
        renderMetricsPanel();

        if (currentTab === "admin") {
          panel.style.display = "block";
        }
        const queue = getAdminReviewQueue();
        const ungradeable = getAdminUngradeableQueue();

        // Drop any selected ids that are no longer in either queue (e.g. after a reload).
        const liveIds = new Set([...queue, ...ungradeable].map(t => t.active_claim_id));
        [...adminSelected].forEach(id => { if (!liveIds.has(id)) adminSelected.delete(id); });

        const bulkBar = adminEditMode ? `
          <div class="panel" style="margin-top:14px;background:var(--soft);">
            <strong>Bulk actions</strong> — <span id="bulkSelectedCount">${adminSelected.size}</span> of ${adminSelectableIds().length} selected
            <div class="panel-actions">
              <button class="neutral-button" onclick="toggleSelectAllAdmin()">${allAdminSelected() ? "Clear selection" : "Select all"}</button>
              <button class="success-button" onclick="bulkAction('accept')">Accept selected</button>
              <button class="neutral-button" onclick="bulkAction('ungradeable')">Grade later selected</button>
              <button class="warning-button" onclick="bulkAction('undo')">Undo submission selected</button>
              <button class="link-button" onclick="toggleAdminEditMode()">Done</button>
            </div>
            <p class="muted" style="margin-top:8px;">"Grade later" only applies to items in the review queue. Items already in "Unable to grade" will be skipped for that action.</p>
          </div>
        ` : "";

        panel.innerHTML = `
          <h2>Admin tools</h2>
          <p>Use these tools carefully. Clear expired claims only affects claims past the 24-hour window.</p>
          <div class="panel-actions">
            <button class="primary-button" onclick="openAddTaskModal()">Add task</button>
            <button class="warning-button" onclick="clearExpiredClaims()">Clear expired claims</button>
            <button class="${adminEditMode ? "primary-button" : "neutral-button"}" onclick="toggleAdminEditMode()">${adminEditMode ? "Exit edit mode" : "Edit"}</button>
          </div>

          ${bulkBar}

          <div class="queue-columns">
            <div>
              <h2>Admin review queue</h2>
              ${queue.length ? `
                <p>Approve if the example was used. Reopen if it should return to the available pool. Send to "Unable to grade" if it needs more investigation.</p>
                ${queue.map(task => renderQueueItem(task, { showGradeLater: true })).join("")}
              ` : `
                <p>No submitted tasks are waiting for review.</p>
              `}
            </div>

            <div>
              <h2>Unable to grade</h2>
              <p>These need a little extra investigation — e.g. broken IDs or those pending eval. They are set aside here to audit later and are not included in the counts above.</p>
              ${ungradeable.length ? `
                ${ungradeable.map(task => renderQueueItem(task, { showGradeLater: false })).join("")}
              ` : `
                <p>Nothing set aside for later.</p>
              `}
            </div>
          </div>
        `;
      }

      // Multi-select filters. Within a group the conditions are OR'd
      // (Available OR Claimed); across groups they are AND'd (status AND domain).
      // An empty group means "no constraint".
      const STATUS_OPTIONS = ["My Claims", "Available", "Claimed", "Submitted", "Approved", "Blocked"];
      const selectedStatuses = new Set();
      const selectedDomains = new Set();
      let openFilterMenu = null;

      function filterGroup(group) {
        return group === "status" ? selectedStatuses : selectedDomains;
      }

      function domainOptions() {
        const seeded = TASKS.map(task => String(task.domain || "").trim()).filter(Boolean);
        return [...new Set([...MOJAVE_DOMAINS, ...seeded])].sort();
      }

      function triggerLabel(group) {
        const set = filterGroup(group);
        if (!set.size) return "All";
        if (set.size === 1) return [...set][0];
        return `${set.size} selected`;
      }

      function toggleFilterMenu(group, event) {
        if (event) event.stopPropagation();
        openFilterMenu = openFilterMenu === group ? null : group;
        renderFilterMenus();
      }

      function toggleFilterValue(group, value, event) {
        if (event) event.stopPropagation();
        const set = filterGroup(group);
        if (set.has(value)) set.delete(value);
        else set.add(value);
        renderTaskList();
      }

      // Chips live outside the menus, so ticking one there should not leave a menu open.
      function toggleFilterValueFromChip(group, value, event) {
        openFilterMenu = null;
        toggleFilterValue(group, value, event);
      }

      function clearFilterGroup(group, event) {
        if (event) event.stopPropagation();
        filterGroup(group).clear();
        renderTaskList();
      }

      function clearAllFilters() {
        selectedStatuses.clear();
        selectedDomains.clear();
        renderTaskList();
      }

      function renderFilterMenus() {
        [["status", STATUS_OPTIONS], ["domain", domainOptions()]].forEach(([group, options]) => {
          const set = filterGroup(group);
          const menu = document.getElementById(group + "Menu");
          const label = document.getElementById(group + "TriggerLabel");

          if (label) label.textContent = triggerLabel(group);
          if (!menu) return;

          const isOpen = openFilterMenu === group;
          menu.hidden = !isOpen;

          const part = menu.closest(".filter-part");
          if (part) part.classList.toggle("is-open", isOpen);

          menu.innerHTML = `
            <div class="filter-menu-list">
              ${options.map(option => `
                <button class="filter-option ${set.has(option) ? "is-on" : ""}" onclick="toggleFilterValue('${escapeAttr(group)}', '${escapeAttr(option)}', event)">
                  <span class="box">&#10003;</span>
                  <span class="text">${escapeHtml(option)}</span>
                </button>
              `).join("")}
            </div>
            <div class="filter-menu-footer">
              <button onclick="clearFilterGroup('${escapeAttr(group)}', event)">Clear</button>
              <button onclick="toggleFilterMenu('${escapeAttr(group)}', event)">Done</button>
            </div>
          `;
        });
      }

      function renderActiveFilters() {
        const el = document.getElementById("activeFilters");
        if (!el) return;

        const chips = [
          ...[...selectedStatuses].map(value => ({ group: "status", value })),
          ...[...selectedDomains].map(value => ({ group: "domain", value }))
        ];

        if (!chips.length) {
          el.innerHTML = "";
          return;
        }

        el.innerHTML = `
          ${chips.map(chip => `
            <button class="filter-chip" onclick="toggleFilterValueFromChip('${escapeAttr(chip.group)}', '${escapeAttr(chip.value)}', event)">
              ${escapeHtml(chip.value)} <span class="x">&times;</span>
            </button>
          `).join("")}
          <button class="filter-chip" onclick="clearAllFilters()">Clear all</button>
        `;
      }

      document.addEventListener("click", function () {
        if (openFilterMenu) {
          openFilterMenu = null;
          renderFilterMenus();
        }
      });

      function matchesStatusFilter(task) {
        if (!selectedStatuses.size) return true;

        return [...selectedStatuses].some(status => {
          if (status === "My Claims") return Boolean(task.active_claim_owned_by_me);
          return effectiveStatus(task) === status;
        });
      }

      // "ID: mjv-xxxx-xxxx" with a copy button, used everywhere an idea id shows.
      function ideaIdChip(taskId, trailing) {
        const id = String(taskId || "");

        return `
          <span class="idea-id">
            <span class="idea-id-label">ID:</span>
            <code>${escapeHtml(id)}</code>
            <button class="id-copy" type="button" title="Copy ID" aria-label="Copy ID ${escapeAttr(id)}" onclick="copyIdeaId('${escapeAttr(id)}', event)">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="9" width="11" height="11" rx="2.5"></rect>
                <path d="M5 15V6a2.5 2.5 0 0 1 2.5-2.5H15"></path>
              </svg>
            </button>
            ${trailing ? `<span class="idea-id-trailing">${trailing}</span>` : ""}
          </span>
        `;
      }

      async function copyIdeaId(id, event) {
        if (event) event.stopPropagation();

        try {
          await navigator.clipboard.writeText(id);
          showMessage(`Copied ${id}`);
        } catch (err) {
          console.error(err);
          showError("Could not copy — your browser may be blocking clipboard access.");
        }
      }

      function renderTaskList() {
        const q = document.getElementById("search").value.toLowerCase();

        renderFilterMenus();
        renderActiveFilters();

        const tasks = TASKS.filter(task => {
          const blob = [
            task.task_id,
            task.domain,
            task.subdomain,
            task.compute_type,
            task.paper_title,
            task.venue_year,
            task.priority,
            task.task_concept,
            task.active_claim_email
          ].join(" ").toLowerCase();

          const matchesText = !q || blob.includes(q);
          const matchesDomain = !selectedDomains.size || selectedDomains.has(String(task.domain || "").trim());

          return matchesText && matchesStatusFilter(task) && matchesDomain;
        });

        document.getElementById("visibleCount").textContent = tasks.length;

        const filterCount = selectedStatuses.size + selectedDomains.size;
        document.getElementById("sectionTitle").textContent =
          filterCount === 0
            ? "All Mojave Task Ideas"
            : filterCount === 1
              ? `${[...selectedStatuses, ...selectedDomains][0]} Mojave Task Ideas`
              : "Filtered Mojave Task Ideas";

        const taskList = document.getElementById("taskList");

        if (!tasks.length) {
          taskList.innerHTML = '<div class="empty">No matching tasks.</div>';
          return;
        }

        taskList.innerHTML = `
          <div class="task-grid">
            ${tasks.map(task => {
              const isHistorical = isHistoricalTask(task);
              const isLocked = isLockedTask(task);
              const canViewDetails = !isLocked && (!isHistorical || isAdmin() || task.active_claim_owned_by_me);

              return `
              <article class="task ${isHistorical ? "task-historical" : ""} ${isLocked ? "task-locked" : ""}">
                <div class="eyebrow">
                  <span class="pill ${escapeHtml(effectiveStatus(task))}">${escapeHtml(effectiveStatus(task))}</span>
                  <span class="pill">${escapeHtml(task.domain || "")}</span>
                  <span class="pill">${escapeHtml(task.subdomain || "")}</span>
                  ${task.compute_type ? `<span class="pill">${escapeHtml(task.compute_type)}</span>` : ""}
                </div>

                <h3 class="task-title">${escapeHtml(task.paper_title)}</h3>
                <p class="task-id">${ideaIdChip(task.task_id, task.venue_year ? " · " + escapeHtml(task.venue_year) : "")}</p>

                <p class="preview">${escapeHtml(shorten(task.task_concept || "", 96))}</p>

                ${isLocked ? `
                  <p class="lock-note">&#128274; ${escapeHtml(effectiveStatus(task))} by another contributor</p>
                ` : ""}

                ${task.status !== "Available" && isAdmin() && claimStatusActorEmail(task) ? `
                  <p class="muted">${escapeHtml(task.status)} by ${escapeHtml(claimStatusActorEmail(task))}</p>
                ` : ""}

                <div class="task-footer">
                  ${canViewDetails
                    ? `<a class="link-button" href="#" onclick="openTaskDetails('${escapeAttr(String(task.task_id))}'); return false;">View details</a>`
                    : `<span class="link-button disabled" title="Details are hidden while another contributor holds this idea">View details</span>`
                  }
                  ${renderTaskAction(task)}
                </div>
              </article>
            `;
            }).join("")}
          </div>
        `;
      }

      function renderTaskAction(task) {
        const actions = [];

        if (!WORKFLOW_A_CLOSED && task.status === "Available" && (!isRetiredTask(task) || isAdmin())) {
          actions.push(`<a class="primary-button" href="#" onclick="claimTask('${escapeAttr(String(task.task_id))}'); return false;">Claim task</a>`);
        }

        if (task.active_claim_owned_by_me && task.status === "Claimed") {
          actions.push(`<a class="danger-button" href="#" onclick="releaseMyClaim(); return false;">Release</a>`);
        }

        if (task.active_claim_owned_by_me && task.status === "Submitted") {
          actions.push(`<span class="pill Submitted">Waiting for review</span>`);
        }

        if (isAdmin() && ["Submitted", "Approved", "Ungradeable"].includes(task.status)) {
          actions.push(`<a class="warning-button" href="#" onclick="undoSubmittedOrApprovedTask('${escapeAttr(String(task.task_id))}'); return false;">Undo submission</a>`);
        }

        return actions.join("");
      }

      function openContributorGuideModal() {
        const modal = document.createElement("div");
        modal.className = "modal-backdrop";

        modal.onclick = function(event) {
          if (event.target === modal) {
            modal.remove();
          }
        };

        modal.innerHTML = `
          <div class="modal">
            <button class="modal-close" onclick="this.closest('.modal-backdrop').remove()">×</button>

            <h2>How to claim and submit a task</h2>
            <p class="muted">Use this dashboard to claim one Mojave task idea at a time, then submit your completed work. An idea is a direction, not a draft — everything you submit must be your own work, written without any AI assistance.</p>

            <div class="modal-section">
              <h3>1. Sign in</h3>
              <p>Click <strong>Sign in with GitHub</strong>. You need to be signed in before you can claim or submit a task.</p>
            </div>

            <div class="modal-section">
              <h3>2. Find a task</h3>
              <p>Browse the task cards, or use search and the status filter to find an available task.</p>
            </div>

            <div class="modal-section">
              <h3>3. Review the details</h3>
              <p>Click <strong>View details</strong> to read the idea, the suggested angles, and the submission reminders.</p>
            </div>

            <div class="modal-section">
              <h3>4. Claim the task</h3>
              <p>Click <strong>Claim task</strong>. You may only have one active claim at a time. Claims expire after 24 hours if they are not submitted.</p>
            </div>

            <div class="modal-section">
              <h3>5. Submit your work</h3>
              <p>After completing the task, return to the dashboard, paste your <strong>Snorkel Submission ID</strong> into the active claim panel, and click <strong>Submit</strong>. The submission ID is at the top left of the task UI and will say <strong>UID</strong>.</p>
            </div>

            <div class="modal-section">
              <h3>Need to stop?</h3>
              <p>Click <strong>Release</strong> on your active claim so someone else can claim the task.</p>
            </div>

            <div class="modal-footer">
              <a class="primary-button" href="#" onclick="this.closest('.modal-backdrop').remove(); return false;">Got it</a>
            </div>
          </div>
        `;

        document.body.appendChild(modal);
      }

      function openTaskDetails(taskId) {
        const task = TASKS.find(t => String(t.task_id) === String(taskId));

        if (!task) {
          showError("Could not find task #" + taskId);
          return;
        }

        if (isLockedTask(task)) {
          showError("Details are hidden while another contributor holds this idea.");
          return;
        }

        const sourcesHtml = Array.isArray(task.sources) && task.sources.length
          ? task.sources.map((source, index) => `
              <a class="primary-button" href="${escapeAttr(source)}" target="_blank" rel="noopener noreferrer">Source ${index + 1}</a>
            `).join("")
          : "<p>No sources listed.</p>";

        const modal = document.createElement("div");
        modal.className = "modal-backdrop";

        modal.onclick = function(event) {
          if (event.target === modal) {
            modal.remove();
          }
        };

        modal.innerHTML = `
          <div class="modal">
            <button class="modal-close" onclick="this.closest('.modal-backdrop').remove()">×</button>

            <div class="eyebrow">
              <span class="pill">${escapeHtml(task.domain || "")}</span>
              <span class="pill">${escapeHtml(task.subdomain || "")}</span>
            </div>

            <h2>${escapeHtml(task.paper_title)}</h2>
            <p class="task-id">${ideaIdChip(task.task_id, task.venue_year ? " · " + escapeHtml(task.venue_year) : "")}</p>

            <div class="eyebrow">
              <span class="pill ${escapeHtml(effectiveStatus(task))}">${escapeHtml(effectiveStatus(task))}</span>
              <span class="pill">Priority: ${escapeHtml(task.priority || "")}</span>
              ${task.compute_type ? `<span class="pill">Compute: ${escapeHtml(task.compute_type)}</span>` : ""}
            </div>

            <div class="modal-section">
              <p>${escapeHtml(task.task_concept || "No idea text listed.")}</p>
            </div>

            <div class="modal-section">
              <h3>Suggested Angles</h3>
              <pre>${escapeHtml(task.suggested_harbor_steps || "No suggested angles listed.")}</pre>
            </div>

            <div class="modal-section">
              <h3>Before You Submit</h3>
              <p>${escapeHtml(task.verifier_ideas || "No reminders listed.")}</p>
            </div>

            <div class="modal-section">
              <h3>Sources</h3>
              <div>${sourcesHtml}</div>
            </div>

            ${effectiveStatus(task) !== "Available" ? `
              <div class="modal-section">
                <h3>Claim Status</h3>
                <p>${escapeHtml(effectiveStatus(task))}${isAdmin() && claimStatusActorEmail(task) ? " by " + escapeHtml(claimStatusActorEmail(task)) : ""}</p>
              </div>
            ` : ""}

            <div class="modal-footer">
              <a class="link-button" href="#" onclick="this.closest('.modal-backdrop').remove(); return false;">Cancel</a>
              ${renderTaskAction(task)}
            </div>
          </div>
        `;

        document.body.appendChild(modal);
      }

      async function claimTask(taskId) {
        clearMessage();
        clearError();

        const task = TASKS.find(t => String(t.task_id) === String(taskId));

        if (!task) {
          showError("Could not find task #" + taskId);
          return;
        }

        if (WORKFLOW_A_CLOSED) {
          showError(WORKFLOW_A_CLOSED_MESSAGE);
          return;
        }

        if (!currentUser) {
          await signInWithGitHub();
          return;
        }

        const myActiveClaim = getMyActiveClaim();

        if (myActiveClaim) {
          showError("You already have an active claim. Submit or release it before claiming another task.");
          return;
        }

        if (task.status !== "Available") {
          showError("This task is not available.");
          return;
        }

        if (isRetiredTask(task) && !isAdmin()) {
          showError("This task has been retired and is no longer available to claim.");
          return;
        }

        const now = new Date();
        const expiresAt = new Date(now.getTime() + CLAIM_TTL_HOURS * 60 * 60 * 1000);

        const { error } = await supabaseClient
          .from("harbor_selected_tasks")
          .insert({
            task_id: task.id,
            user_id: currentUser.id,
            user_email: currentUser.email || null,
            status: "claimed",
            selected_at: now.toISOString(),
            expires_at: expiresAt.toISOString()
          });

        if (error) {
          console.error(error);
          showError("Could not claim this task. It may already be claimed, or you may already have an active claim.");
          return;
        }

        showMessage("Task claimed.");
        await loadTasks();
      }

      async function releaseMyClaim() {
        clearMessage();
        clearError();

        if (!currentUser) {
          await signInWithGitHub();
          return;
        }

        const claim = getMyActiveClaim();

        if (!claim || !claim.active_claim_id) {
          showError("You do not have an active claim.");
          return;
        }

        const { error } = await supabaseClient
          .from("harbor_selected_tasks")
          .update({
            status: "abandoned",
            expires_at: null,
            notes: "Released by contributor"
          })
          .eq("id", claim.active_claim_id)
          .eq("user_id", currentUser.id);

        if (error) {
          console.error(error);
          showError("Could not release your claim.");
          return;
        }

        showMessage("Claim released.");
        await loadTasks();
      }

      async function submitMyClaim() {
        clearMessage();
        clearError();

        if (!currentUser) {
          await signInWithGitHub();
          return;
        }

        const claim = getMyActiveClaim();

        if (!claim || !claim.active_claim_id) {
          showError("You do not have an active claim to submit.");
          return;
        }

        const submissionInput = document.getElementById("snorkelSubmissionId");
        const submissionId = normalizeSubmissionId(submissionInput?.value);

        if (!submissionId) {
          showError("Snorkel Submission ID is required.");
          return;
        }

        // Hard block: a malformed ID cannot be submitted.
        if (!isValidSubmissionId(submissionId)) {
          const hint = document.getElementById("submissionIdHint");
          if (hint) hint.style.display = "block";
          showError(
            "That doesn't look like a valid Snorkel submission ID. It should be the UID " +
            "from the top left of the task UI, e.g. beb0150b-a18b-4735-90b7-3a1e1086669d."
          );
          return;
        }

        const now = new Date().toISOString();

        const { error } = await supabaseClient
          .from("harbor_selected_tasks")
          .update({
            status: "submitted",
            snorkel_submission_id: submissionId,
            submitted_for_review_at: now,
            expires_at: null
          })
          .eq("id", claim.active_claim_id)
          .eq("user_id", currentUser.id);

        if (error) {
          console.error(error);
          showError("Could not submit your claim.");
          return;
        }

        showMessage("Task submitted for review.");
        await loadTasks();
      }

      async function approveTask(taskId) {
        clearMessage();
        clearError();

        if (!isAdmin()) {
          showError("You do not have permission to approve tasks.");
          return;
        }

        const task = TASKS.find(t => String(t.task_id) === String(taskId));

        if (!task || !["Submitted", "Ungradeable"].includes(task.status)) {
          showError("This task is not currently awaiting review.");
          return;
        }

        const now = new Date().toISOString();

        const { error } = await supabaseClient
          .from("harbor_selected_tasks")
          .update({
            status: "approved",
            completed_at: now,
            reviewed_at: now,
            reviewed_by: currentUser.id,
            admin_email: currentUser.email || null
          })
          .eq("id", task.active_claim_id);

        if (error) {
          console.error(error);
          showError("Could not approve this task.");
          return;
        }

        showMessage("Task accepted.");
        await loadTasks();
      }

      async function markUngradeable(taskId) {
        clearMessage();
        clearError();

        if (!isAdmin()) {
          showError("You do not have permission to do this.");
          return;
        }

        const task = TASKS.find(t => String(t.task_id) === String(taskId));

        if (!task || task.status !== "Submitted") {
          showError("This task is not currently submitted for review.");
          return;
        }

        const now = new Date().toISOString();

        const { error } = await supabaseClient
          .from("harbor_selected_tasks")
          .update({
            status: "ungradeable",
            reviewed_at: now,
            reviewed_by: currentUser.id,
            admin_email: currentUser.email || null,
            notes: "Set aside as unable to grade (needs investigation)"
          })
          .eq("id", task.active_claim_id);

        if (error) {
          console.error(error);
          showError("Could not move this to Unable to grade.");
          return;
        }

        showMessage("Moved to Unable to grade.");
        await loadTasks();
      }

      function buildIdeaText(task) {
        const lines = [];

        lines.push(`${task.paper_title || ""} (ID: ${task.task_id})`);

        const meta = [task.venue_year, task.domain, task.subdomain, task.compute_type].filter(Boolean).join(" · ");
        if (meta) lines.push(meta);

        if (task.active_claim_submission_id) {
          lines.push(`Snorkel Submission ID: ${task.active_claim_submission_id}`);
        }

        lines.push("");
        lines.push("The Idea:");
        lines.push(task.task_concept || "(none)");

        lines.push("");
        lines.push("Suggested Angles:");
        lines.push(task.suggested_harbor_steps || "(none)");

        lines.push("");
        lines.push("Before You Submit:");
        lines.push(task.verifier_ideas || "(none)");

        if (Array.isArray(task.sources) && task.sources.length) {
          lines.push("");
          lines.push("Sources:");
          task.sources.forEach(source => lines.push(source));
        }

        return lines.join("\n");
      }

      async function copyIdeaToClipboard(taskId) {
        clearMessage();
        clearError();

        if (!isAdmin()) {
          showError("You do not have permission to copy this idea.");
          return;
        }

        const task = TASKS.find(t => String(t.task_id) === String(taskId));

        if (!task) {
          showError("Could not find task #" + taskId);
          return;
        }

        const text = buildIdeaText(task);

        try {
          await navigator.clipboard.writeText(text);
          showMessage("Idea copied to clipboard.");
        } catch (err) {
          console.error(err);
          showError("Could not copy idea to clipboard. Your browser may be blocking clipboard access.");
        }
      }

      async function undoSubmittedOrApprovedTask(taskId) {
        clearMessage();
        clearError();

        if (!isAdmin()) {
          showError("You do not have permission to undo submissions.");
          return;
        }

        const task = TASKS.find(t => String(t.task_id) === String(taskId));

        if (!task || !["Submitted", "Approved", "Ungradeable"].includes(task.status)) {
          showError("This task is not currently submitted, approved, or set aside.");
          return;
        }

        const warning = "Warning: this will undo an accepted/submitted task and return it to the available pool. Only continue if the submission was accepted by mistake or needs to be reassigned.";

        if (!window.confirm(warning)) {
          return;
        }

        const now = new Date().toISOString();

        const { error } = await supabaseClient
          .from("harbor_selected_tasks")
          .update({
            status: "reopened",
            reviewed_at: now,
            reviewed_by: currentUser.id,
            admin_email: currentUser.email || null,
            expires_at: null,
            notes: "Submission/approval undone by admin"
          })
          .eq("id", task.active_claim_id);

        if (error) {
          console.error(error);
          showError("Could not undo this submission.");
          return;
        }

        showMessage("Submission undone. Task returned to available pool.");
        await loadTasks();
      }

      async function bulkAction(action) {
        clearMessage();
        clearError();

        if (!isAdmin()) {
          showError("You do not have permission to do this.");
          return;
        }

        // Resolve the selected claim IDs to their current tasks.
        const selectedTasks = TASKS.filter(t => t.active_claim_id && adminSelected.has(t.active_claim_id));

        if (!selectedTasks.length) {
          showError("No items selected. Tick the checkboxes next to the tasks you want to act on.");
          return;
        }

        const now = new Date().toISOString();
        let update;
        let eligible;
        let verb;

        if (action === "accept") {
          eligible = selectedTasks.filter(t => ["Submitted", "Ungradeable"].includes(t.status));
          update = { status: "approved", completed_at: now, reviewed_at: now, reviewed_by: currentUser.id, admin_email: currentUser.email || null };
          verb = "accepted";
        } else if (action === "ungradeable") {
          // Grade later only makes sense for items still in the review queue.
          eligible = selectedTasks.filter(t => t.status === "Submitted");
          update = { status: "ungradeable", reviewed_at: now, reviewed_by: currentUser.id, admin_email: currentUser.email || null, notes: "Set aside as unable to grade (needs investigation)" };
          verb = "moved to Unable to grade";
        } else if (action === "undo") {
          eligible = selectedTasks.filter(t => ["Submitted", "Approved", "Ungradeable"].includes(t.status));
          update = { status: "reopened", reviewed_at: now, reviewed_by: currentUser.id, admin_email: currentUser.email || null, expires_at: null, notes: "Submission/approval undone by admin" };
          verb = "undone and returned to the available pool";
        } else {
          showError("Unknown bulk action.");
          return;
        }

        if (!eligible.length) {
          showError("None of the selected items are eligible for that action.");
          return;
        }

        const skipped = selectedTasks.length - eligible.length;
        const confirmMsg =
          `This will bulk-${action === "undo" ? "undo" : action === "accept" ? "accept" : "grade-later"} ${eligible.length} item(s)` +
          (skipped ? ` (${skipped} selected item(s) will be skipped as not eligible)` : "") +
          `.\n\nContinue?`;

        if (!window.confirm(confirmMsg)) {
          return;
        }

        const ids = eligible.map(t => t.active_claim_id);

        // One update call covering all eligible rows.
        const { error } = await supabaseClient
          .from("harbor_selected_tasks")
          .update(update)
          .in("id", ids);

        if (error) {
          console.error(error);
          showError("Could not complete the bulk action. No changes may have been applied — please refresh and check.");
          return;
        }

        adminSelected.clear();
        adminEditMode = false;
        showMessage(`${eligible.length} item(s) ${verb}.`);
        await loadTasks();
      }

      async function clearExpiredClaims() {
        clearMessage();
        clearError();

        if (!isAdmin()) {
          showError("You do not have permission to clear expired claims.");
          return;
        }

        const { data, error } = await supabaseClient.rpc("clear_expired_harbor_claims");

        if (error) {
          console.error(error);
          showError("Could not clear expired claims.");
          return;
        }

        const count = Number(data || 0);
        showMessage(`${count} expired claim(s) cleared.`);
        await loadTasks();
      }

      function regenerateIdeaKey() {
        const input = document.getElementById("newTaskDisplayId");
        if (input) input.value = newIdeaKey();
      }

      function syncSubdomainOptions() {
        const domainSelect = document.getElementById("newTaskDomain");
        const subSelect = document.getElementById("newTaskSubdomain");
        if (!domainSelect || !subSelect) return;

        const options = subdomainsFor(domainSelect.value);
        subSelect.innerHTML = options
          .map(sub => `<option value="${escapeAttr(sub)}">${escapeHtml(sub)}</option>`)
          .join("");
